name: Browser lifecycle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-lifecycle-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
